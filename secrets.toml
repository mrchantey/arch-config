[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for the arch-config assets stack; per repo, never shared"
modified = "2026-09-28T08:12:05.294Z"
roll = """
manual:not re-mintable: losing it loses this stack's state, and a new one cannot read what the old one wrote
> beet secrets/set TF_STATE_PASSPHRASE_OLD --copy=TF_STATE_PASSPHRASE --role=env_var
> beet secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --rotation=.. (set keeps no metadata)
> just assets rotate-state, then just assets plan to prove the state still reads
> beet secrets/rm TF_STATE_PASSPHRASE_OLD"""

