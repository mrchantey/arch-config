[groups.default.secrets.AWS_ACCESS_KEY_ID]
role = "env_var"
note = "aws deployer: the iam user's access key id; the deploy verbs read the pair from here, never from ~/.aws"
modified = "2026-09-25T04:32:17.746Z"
rotation = """
manual:https://console.aws.amazon.com/iam/home#/users
> Users > <the deployer user> > Security credentials > Create access key
> re-mint both halves together: this and AWS_SECRET_ACCESS_KEY
> then deactivate and delete the old key"""

[groups.default.secrets.AWS_SECRET_ACCESS_KEY]
role = "env_var"
note = "aws deployer: the secret half of AWS_ACCESS_KEY_ID, shown once at creation"
modified = "2026-09-25T04:32:24.038Z"
rotation = """
manual:https://console.aws.amazon.com/iam/home#/users
> with AWS_ACCESS_KEY_ID: the same Create access key mints both halves"""

