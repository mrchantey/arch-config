[groups.default.secrets.AWS_ACCESS_KEY_ID]
role = "env_var"
note = "aws deployer `arch-config-deployer`: the access key id of this repo's own iam user; the deploy verbs and every `aws s3 sync` read the pair from here, never from ~/.aws"
modified = "2026-09-27T04:34:37.015Z"
rotation = """
manual:beet deployer/mint --rotate
> with an admin pair in the environment, which wins over this document: `AWS_ACCESS_KEY_ID=.. AWS_SECRET_ACCESS_KEY=.. beet deployer/mint --rotate`
> both halves are minted, sealed and proven together, then the old key is deleted"""

[groups.default.secrets.AWS_SECRET_ACCESS_KEY]
role = "env_var"
note = "aws deployer `arch-config-deployer`: the secret half of AWS_ACCESS_KEY_ID, shown once at creation"
modified = "2026-09-27T04:34:37.015Z"
rotation = """
manual:beet deployer/mint --rotate
> with an admin pair in the environment, which wins over this document: `AWS_ACCESS_KEY_ID=.. AWS_SECRET_ACCESS_KEY=.. beet deployer/mint --rotate`
> both halves are minted, sealed and proven together, then the old key is deleted"""

[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "tofu state passphrase for the arch-config assets stack; per repo, never shared"
modified = "2026-09-25T04:32:10.046Z"
rotation = "remint"

