# Read by /usr/bin/google-chrome-stable, which passes every line not starting
# with # to the browser. Takes effect only when the main Chrome process starts,
# so quit every window (PWAs included) after editing.
#
# Stops WebRTC's AGC from moving the OS mic gain. During any call (Meet,
# Collaborate) it raises the hardware gain while it hears quiet speech and never
# lowers it after, and WirePlumber persists whatever it set. On silver-fox that
# walked the Brio 100 from +6dB to +22dB and wrecked voxtype dictation. The
# browser's own digital gain still runs, it just stays inside the call. Chromium
# keeps only the last --disable-features switch, so add features to this line
# comma separated rather than as a second line.
--disable-features=WebRtcAllowInputVolumeAdjustment
