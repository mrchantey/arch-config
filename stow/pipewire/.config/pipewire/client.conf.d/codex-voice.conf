# Codex's /voice host drops most of its mic audio when capture arrives in chunks
# above ~1024 frames.
#
# /voice captures through its own `codex-voice-host` process, an ALSA client of
# PipeWire. With larger chunks the gaps reach OpenAI as zero-filled 10ms blocks,
# so the model hears fragments and never answers while the mic meter still moves.
# The host asks for 2400-frame periods itself, which lands the graph at its 2048
# max quantum. It only failed some of the time because anything else capturing
# the same mic at a lower latency, voxtype in particular, holds the whole graph
# at 1024.
#
# 8192 bytes is 1024 frames of the F32 stereo it opens, which pins the graph
# quantum. The PipeWire ALSA plugin reads this when the host starts, so it applies
# from the next Codex launch. A `node.latency` override does not work here, the
# plugin derives latency from the period. Check with `pw-top` during /voice:
# `alsa_capture.codex-voice-host` should read 1024.
alsa.rules = [
    {   matches = [ { application.process.binary = "codex-voice-host" } ]
        actions = {
            update-props = {
                alsa.period-bytes = { min = 128 max = 8192 }
            }
        }
    }
]
