# Codex's /voice host drops most of its mic audio when capture arrives in chunks
# above ~1024 frames, see "Codex voice needs small capture chunks" in AGENTS.md.
# 8192 bytes is 1024 frames of the F32 stereo it opens, which pins the graph quantum.
alsa.rules = [
    {   matches = [ { application.process.binary = "codex-voice-host" } ]
        actions = {
            update-props = {
                alsa.period-bytes = { min = 128 max = 8192 }
            }
        }
    }
]
