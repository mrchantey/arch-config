## Start every Logitech Brio 100 mic at its +6dB hardware floor.
##
## The Brio powers on at +30dB and clips, see docs/devices/silver-fox.md.
## WirePlumber persists a gain per unit (~/.local/state/wireplumber/default-routes),
## so this only applies to a unit it has never seen, which would otherwise start
## at the global default of 1.0. The value is linear: 0.064 = wpctl 0.4 cubed.
## The serial is left out of the match so any replacement unit is covered.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-046d_Brio_100_.*"
      }
    ]
    actions = {
      update-props = {
        device.routes.default-source-volume = 0.064
      }
    }
  }
]
