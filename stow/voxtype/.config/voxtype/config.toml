# voxtype configuration (full schema reference: /etc/voxtype/config.toml)

# state written for `voxtype status` / waybar; "auto" => $XDG_RUNTIME_DIR/voxtype/state
state_file = "auto"

[hotkey]
# built-in evdev hotkey disabled, recording is driven by Hyprland push-to-talk binds
# on Pause and Insert (DICTATION in ~/.config/hypr/bindings.lua), so no 'input' group
# is needed
enabled = false
key = "SCROLLLOCK"
modifiers = []

[audio]

# Duck media instead of pausing it: `duck_media` scales every active PulseAudio/
# PipeWire sink-input to `duck_media_volume_percent` of its *current* level while the
# mic is open and restores it on release, so music keeps playing quietly under
# dictation instead of stopping dead. `pause_media` (MPRIS play/pause over D-Bus) is
# the other half of the pair — enable one or the other, not both.
pause_media = false
duck_media = true
duck_media_volume_percent = 20
# Ease down/up rather than jump; the fade runs alongside capture so it never delays
# the mic. 0 is the old instant behaviour.
duck_media_fade_ms = 100
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "large-v3-turbo"
language = "en"
translate = false
on_demand_loading = false
# context_window_optimization stays OFF. It encodes only the clip's length instead of
# Whisper's padded 30s window, which cut a 5.8s clip on silver-fox's 20W-capped dGPU
# from 4.85s to 1.36s, but the truncated window sends turbo into repetition loops: the
# same sentence typed 2 to 4 times in one transcript, mostly on short clips at the
# audio_ctx=384 floor. With it on (2026-11-20) 11 of 125 dictations repeated, against
# 0 of ~540 in the week before. Flash attention is a pure speedup and stays.
context_window_optimization = false
flash_attention = true
# gpu_isolation is intentionally OFF (the schema default). It spawns a fresh worker
# per clip, which reloads the model (~1.7s) and only opens the mic after — that delay
# swallows short push-to-talk recordings ("No audio was captured"). GPU selection on
# hybrid-graphics laptops is instead pinned by GGML_VK_VISIBLE_DEVICES in the per-device
# drop-in (~/.config/systemd/user/voxtype.service.d/gpu.conf, written by `just
# setup-voxtype-gpu`), which the persistent daemon honors — so isolation isn't needed.
# Per-device overrides (silver-fox runs small.en) live in devices/<hostname>.toml.

# Whisper turns a clip with no speech into a stock phrase ("Thank you.", "Welcome back
# to the show."), which happens whenever push-to-talk is pressed and then released
# without speaking. Silero VAD (`voxtype setup vad`) drops those clips before whisper
# sees them; a lone "Yes." still measures ~0.5s of speech, well over the 100ms floor.
# Cost: the check runs on the CPU with ggml's default 4 spin-waiting threads, which
# voxtype does not expose. ~25ms idle, but while every core is busy (a cargo build, even
# at nice 19) it stalls 1 to 8s between release and typing; 4 threads pinned to one core
# take 60s. whisper.cpp's "vad time" log line is a running total, the per-clip cost is
# the jump between lines. The energy backend avoids the threads but cannot separate
# room noise from a soft "yes" at any threshold.
[vad]
enabled = true
backend = "whisper"

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
# releasing without speaking is deliberate, not a mic fault, so a VAD skip stays silent
on_no_speech = false

[status]
icon_theme = "emoji"


