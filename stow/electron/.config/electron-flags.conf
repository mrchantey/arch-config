# Read by Arch's electron wrapper (/usr/bin/electron43 and friends) before it
# exec's the app. The wrapper prefers ~/.config/electron<N>-flags.conf and falls
# back to this generic name, which is why this file is deliberately not version
# pinned: element-desktop is `exec electron43 /usr/lib/element/app.asar "$@"`
# today and will move to electron44 on its own schedule. The flip side is that a
# versioned file appearing later would shadow this one completely.
#
# Electron picks its safeStorage backend from the desktop environment, and
# Chromium only auto-selects libsecret for GNOME-family desktops. Here
# XDG_CURRENT_DESKTOP is Hyprland, so it falls back to the "basic" store and
# Element greets you with "Your system has an unsupported keyring meaning the
# database cannot be opened", offering weaker encryption. Never accept that
# offer: the basic backend's key cannot be derived once this flag is in place,
# so the database it writes is stranded and the session has to be re-verified.
--password-store=gnome-libsecret

# Wayland needs nothing here. ELECTRON_OZONE_PLATFORM_HINT=wayland is set for
# the whole session by omarchy's default/hypr/envs.lua.
