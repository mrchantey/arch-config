# A closed lid must not suspend this machine while it is on mains power.
#
# The failure this fixes does not involve touching the lid. logind suppresses
# the lid-close action while an external display is attached
# (HandleLidSwitchDocked defaults to ignore), but it does not then forget: it
# installs a repeating re-check timer (button_recheck) and re-asks "still
# docked?" roughly every 30s for as long as the lid stays shut. Locking the
# screen turns the display off, the monitor drops HDMI hot-plug detect a few
# seconds later, and the next re-check sees no external display, falls through
# to HandleLidSwitch -- stock default `suspend` -- and sleeps a machine that was
# mid-work. Observed on silver-fox as "I locked it and it suspended instead",
# and as an overnight agent run dying 11 minutes after the last keypress.
#
# HandleLidSwitchExternalPower is ignored entirely unless it is set, which is
# exactly why the fall-through reached HandleLidSwitch. Setting it splits the
# two cases this machine actually has: clamshelled at a desk on mains, where
# the lid is shut all day and nothing should ever sleep on its own, and
# unplugged, where a closed lid still means "in a bag" and suspend is right.
#
# Known edge, and it is the intended battery behaviour arriving without a lid
# movement to explain it: unplugging the charger while clamshelled hands the
# decision back to HandleLidSwitch, so the next re-check suspends within ~30s.
#
# Sorts after omarchy's own 10-/20- drop-ins and is not package-owned, so
# `omarchy update` leaves it alone.

[Login]
HandleLidSwitchExternalPower=ignore
